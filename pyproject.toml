[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janus"
version = "0.1.0"
description = "A Python library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic[email]>=2.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
    "PyJWT>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/christianGRogers/Janus"
Issues = "https://github.com/christianGRogers/Janus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["janus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
