name: Deploy Janus Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to bradensbay.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: bradensbay.com
          username: christian
          password: ${{ secrets.SSH_PASSWORD }}
          port: 23
          script: |
            set -e

            APP_DIR="/home/christian/janus"

            # Clone or update the repository
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git init
              git remote add origin https://github.com/christianGRogers/Janus.git
              git fetch origin main
              git reset --hard origin/main
            fi

            # Run the deploy script
            chmod +x deploy/remote_deploy.sh
            bash deploy/remote_deploy.sh
